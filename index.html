<script>try{var t=localStorage.getItem('mp-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#06110c;--bg2:#0c1f16;--fg:#eef4f0;--mut:#9db3a6;--mint:#6fe3a8;--gold:#d4b05a;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--inp:rgba(0,0,0,.35);--btnfg:#04140c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f7f5f0;--bg2:#ecebe4;--fg:#14211a;--mut:#53665b;--mint:#17744a;--gold:#8f6c14;--glass:rgba(255,255,255,.7);--bd:rgba(20,33,26,.14);--inp:#fff;--btnfg:#fff}
:root:not([data-theme=light]):not([data-theme=dark]){--bg:#06110c}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:5rem;height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:500;line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,7vw,5rem)}h2{font-size:clamp(1.8rem,4.5vw,3rem)}h3{font-size:1.25rem}
a{color:inherit}p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem}
section{padding:clamp(3.5rem,9vw,7rem) 0}
.alt{background:linear-gradient(180deg,var(--bg2),var(--bg))}
.mut{color:var(--mut)}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.6rem 1.4rem;border-radius:12px;border:1px solid var(--bd);background:var(--glass);color:var(--fg);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--mint);color:var(--btnfg);border-color:transparent}
.btn.p:hover{box-shadow:0 8px 28px -8px var(--mint)}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.s{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--bd)}
.bar{display:flex;align-items:center;gap:.75rem;height:68px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:Georgia,serif;font-size:1.15rem;margin-right:auto;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:8px;object-fit:cover}
nav ul{display:flex;gap:1.2rem;list-style:none;margin:0;padding:0}
nav a{text-decoration:none;font-size:.95rem;color:var(--mut)}nav a:hover{color:var(--fg)}
.ic{min-width:44px;min-height:44px;padding:0 .6rem}
#menu{display:none}
@media(max-width:960px){#menu{display:inline-flex}.hq{display:none}nav{position:fixed;inset:68px 0 auto 0;background:var(--bg);border-bottom:1px solid var(--bd);padding:1rem 1.25rem 1.5rem;display:none}nav.o{display:block}nav ul{flex-direction:column;gap:0}nav a{display:block;padding:.8rem 0;font-size:1.1rem}}
.hero{min-height:100svh;display:flex;align-items:center;padding:7rem 0 4rem;background:radial-gradient(60% 50% at 75% 40%,rgba(111,227,168,.16),transparent),radial-gradient(40% 40% at 10% 90%,rgba(212,176,90,.10),transparent),var(--bg)}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center}
@media(max-width:860px){.hg{grid-template-columns:1fr}.hero{min-height:auto}}
.hero h1 span{display:block;color:var(--mut);font-size:.5em;margin-top:.5em;line-height:1.2}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.mark{border-radius:24px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 40px 80px -30px #000;background:#000;animation:rise 1s ease both}
.mark img{display:block;width:100%;height:auto;aspect-ratio:865/593;object-fit:cover}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.card{padding:1.5rem;transition:border-color .2s}.card:hover{border-color:var(--mint)}
.card .tag{display:block;width:34px;height:3px;background:var(--gold);margin-bottom:1rem;border-radius:2px}
.card a{color:var(--mint);font-weight:600;text-decoration:none}
.calc{display:grid;grid-template-columns:1.2fr .8fr;gap:1.2rem;align-items:start}
@media(max-width:860px){.calc{grid-template-columns:1fr}}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;padding:1.5rem}
label{display:block;font-size:.88rem;margin-bottom:.3rem;color:var(--mut)}
input,select,textarea{width:100%;min-height:46px;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--bd);background:var(--inp);color:var(--fg);font:inherit}
input[type=range]{padding:0;accent-color:var(--mint)}
.ck{display:flex;gap:.6rem;align-items:center}.ck input{width:20px;min-height:20px}.ck label{margin:0;color:var(--fg)}
.full{grid-column:1/-1}
.res{padding:1.5rem;position:sticky;top:5.5rem}
.tot{font-family:Georgia,serif;font-size:clamp(2.2rem,6vw,3.2rem);color:var(--mint);line-height:1}
.res ul{list-style:none;padding:0;margin:1rem 0;font-size:.92rem}.res li{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--bd)}
.err{color:#ff8a80;font-size:.85rem;min-height:1.1em;margin-top:.25rem}
:root[data-theme=light] .err{color:#b3261e}
.note{font-size:.85rem;color:var(--mut)}
.msg{padding:.9rem 1rem;border-radius:10px;border:1px solid var(--gold);margin-top:1rem}
.hp{position:absolute;left:-9999px}
details{border-bottom:1px solid var(--bd);padding:1rem 0}summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:1rem}
summary::after{content:"+";color:var(--mint);font-size:1.4rem;line-height:1}details[open] summary::after{content:"–"}
footer{padding:3rem 0 2rem;border-top:1px solid var(--bd)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem}
footer ul{list-style:none;padding:0;margin:0}footer li{margin:.4rem 0}footer a{color:var(--mut);text-decoration:none}footer a:hover{color:var(--fg)}
.areas{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0}.areas span{padding:.5rem 1rem;border:1px solid var(--bd);border-radius:10px;background:var(--glass)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}@media(max-width:860px){.two{grid-template-columns:1fr}}
.priv{display:none}.priv:target{display:block;position:fixed;inset:0;z-index:99;background:var(--bg);overflow:auto;padding:5rem 1.25rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};let L=ls.get('mp-lang')||'fi',last=null;

function render(){
 document.documentElement.lang=L;$('#lang').textContent=L==='fi'?'EN':'FI';$('#lang').setAttribute('aria-label',L==='fi'?'Switch to English':'Vaihda suomeksi');
 $$('[data-i]').forEach(e=>{e.innerHTML=t(e.dataset.i)});

 $('#ar').innerHTML=['Helsinki','Espoo','Vantaa','Kirkkonummi'].map(a=>`<span>${a}</span>`).join('')+`<span>${t('a_o')}</span>`;
 $('#wy').innerHTML=[1,2,3,4,5].map(n=>`<p><b>${t('w'+n)}</b><br><span class="mut">${t('w'+n+'d')}</span></p>`).join('');
 $('#fq').innerHTML=FQ.map(f=>`<details><summary>${f[i]}</summary><p class="mut" style="margin-top:.6rem">${f[2+i]}</p></details>`).join('');
 themeLabel();calc();
}
function themeLabel(){const d=document.documentElement.dataset.theme==='dark';$('#theme').textContent=d?'☾':'☀';$('#theme').setAttribute('aria-label',L==='fi'?(d?'Tumma teema, vaihda vaaleaan':'Vaalea teema, vaihda tummaan'):(d?'Dark theme, switch to light':'Light theme, switch to dark'))}
function calc(){
 const P=CONFIG.pricing,m2=+$('#m2').value;$('#m2v').textContent=m2;
 const kmRaw=$('#km').value.trim(),band=+$('#band').value;let km=null,err='';
 if(kmRaw!==''){const v=Number(kmRaw);if(!isFinite(v)||v<0||v>1000)err=t('e_dist');else km=v}else if(band>0)km=P.bandKm[band-1];
 $('#e_km').textContent=err;
 if(km===null){$('#tot').textContent='—';$('#bd').innerHTML='';last=null;return}
 const ff=Math.max(0,Math.min(40,+$('#ff').value||0)),tf=Math.max(0,Math.min(40,+$('#tf').value||0));
 const fl=(ff*(($('#fe').checked)?P.perFloorLift:P.perFloorNoLift))+(tf*(($('#te').checked)?P.perFloorLift:P.perFloorNoLift));
 const size=m2*P.perM2*(+$('#type').value)*(+$('#vol').value);
 const rows=[[t('r_base'),P.base],[t('r_size'),size],[t('r_dist'),km*P.perKm],[t('r_fl'),fl]];
 if($('#pk').checked)rows.push([t('r_pk'),Math.max(P.packing.min,m2*P.packing.perM2)]);
 if($('#ca').checked)rows.push([t('r_ca'),P.carry]);
 if($('#ex').checked)rows.push([t('r_ex'),P.extra]);
 const tot=Math.max(0,rows.reduce((a,r)=>a+r[1],0));last={tot:Math.round(tot),m2,km,ff,tf,fe:$('#fe').checked,te:$('#te').checked,pk:$('#pk').checked,ca:$('#ca').checked,ex:$('#ex').checked};
 $('#tot').textContent=fmt(tot);$('#bd').innerHTML=rows.filter(r=>r[1]>0).map(r=>`<li><span>${r[0]}</span><span>${fmt(r[1])}</span></li>`).join('');
 summary();
}
function summary(){$('#qs').textContent=t('q_sum')+': '+(last?`${last.m2} m², ${last.km} km, ${fmt(last.tot)}`:t('q_nopr'))}
$('#cf').addEventListener('input',calc);
$('#lang').onclick=()=>{L=L==='fi'?'en':'fi';ls.set('mp-lang',L);render()};
$('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('mp-theme',n)}catch(e){}themeLabel()};

addEventListener('scroll',()=>$('#hd').classList.toggle('s',scrollY>20),{passive:true});
$('#date').min=new Date().toISOString().slice(0,10);$('#yr').textContent=new Date().getFullYear();
function setErr(id,m){$('#e_'+id).textContent=m}
$('#qf').addEventListener('submit',async e=>{
 e.preventDefault();if($('#qh').value)return; // honeypot
 let ok=true;const n=$('#qn').value.trim(),p=$('#qp').value.trim(),m=$('#qe').value.trim();
 setErr('qn',n?'':t('e_req'));setErr('qp',!p?t('e_req'):(/^[+\d][\d\s-]{5,}$/.test(p)?'':t('e_ph')));setErr('qe',!m?t('e_req'):(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)?'':t('e_mail')));setErr('qc',$('#qc').checked?'':t('e_cons'));
 if($$('.err').some(x=>x.id!=='e_km'&&x.textContent))ok=false;if(!ok){$('#qf [aria-invalid]');return}
 const data={name:n,phone:p,email:m,message:$('#qm').value,from:$('#from').value,to:$('#to').value,date:$('#date').value,estimate:last,lang:L};
 const r=$('#qr'),b=$('#qb');r.hidden=false;
 if(!CONFIG.endpoint){r.textContent=t('demo');const body=encodeURIComponent(JSON.stringify(data,null,1));setTimeout(()=>{location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent('Tarjouspyyntö / Quote request')}&body=${body}`},1200);return}
 b.disabled=true;r.textContent=t('sending');
 try{const res=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!res.ok)throw 0;r.textContent=t('ok');e.target.reset()}catch(x){r.textContent=t('fail')}
 b.disabled=false;
});
render();
